<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="1; url=https://sunrisegames.shop/" />
    <title>Redirecting</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #111827;
        color: #ffffff;
      }

      .redirecting {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .spinner {
        width: 0.9em;
        height: 0.9em;
        border: 0.12em solid rgba(255, 255, 255, 0.35);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      window.setTimeout(function () {
        window.location.replace('https://sunrisegames.shop/');
      }, 1000);
    </script>
  </head>
  <body>
    <main class="redirecting" aria-live="polite">
      <span>Redirecting</span>
      <span class="spinner" aria-label="Loading" role="status"></span>
    </main>
  </body>
</html>
